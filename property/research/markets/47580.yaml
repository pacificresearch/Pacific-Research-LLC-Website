tax_rules:
  verified: false
  post_sale_treatment: "Georgia assesses at 40% of fair market value (O.C.G.A. 48-5-7), set by the county Board of Tax Assessors each year; the most recent arm's-length bona fide sale price is the maximum allowable FMV for the next taxable year (48-5-2(3)), and assessors commonly move value to the sale price, so a buyer paying above the prior assessment should expect the assessment to rise toward the purchase price. No separate rental ratio. HB 581's inflation-indexed floating homestead cap applies to homesteads only (Houston County Board of Education opted out in 2025) — no cap on non-homestead rental property. Every parcel must be appraised at least every three years."
  risk: "MEDIUM"
  assessor_url: "https://www.houstoncountyga.gov/residents/tax-assessor.cms"
  treasurer_url: "https://www.houstoncountytax.com/"
  source_url: "https://codes.findlaw.com/ga/title-48-revenue-and-taxation/ga-code-sect-48-5-2.html"

