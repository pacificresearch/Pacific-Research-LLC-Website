landlord_law:
  verified: false
  rent_control: "no state rent control and no state preemption — the municipal rent control chapters (30 MRS ch. 244; 30-A MRS ch. 167) are repealed and 30-A MRS §3007 contains no rent/registration preemption (LD 522 of 2019 proposing one did not appear in the current text); Portland has local rent control (Ch. 6 Art. XI, under litigation CUMcv-21-40); Bangor has NO rent control — its Ch. 282 Tenants' Housing Rights Ordinance regulates notice and fees only"
  just_cause_eviction: "no — 14 MRS §6002: tenancy at will ends on 30 days' written notice without cause; 7-day notice for cause (rent 7+ days in arrears, damage, nuisance, unauthorized occupant); tenant may cure nonpayment before expiry and reinstate after by paying arrears + landlord filing/service fees; Bangor Ch. 282 adds 60 days' written notice of ANY rent increase (state default 14 MRS §6015: 45 days, 75 days if increase >= 10% per Maine AG 2026-01-29 advisory — statute page not read)"
  eviction_timeline_days: null   # notice is 7 or 30 days; forcible entry & detainer (14 MRS §6001 et seq.) court timeline not read on a primary page
  rental_licensing: "no general long-term rental registration or license in Bangor as of 2026-11 — only a VOLUNTARY 'Quality Housing Provider' rental registry pilot (guidelines PDF not readable) and mandatory short-term rental registration (Ch. 254, adopted 2023-10-23, $100 renewal); vacant-building registration under Ch. 223 §223-8"
  rental_license_fee_annual: null
  inspection_frequency: "none on a cycle for long-term rentals — Code Enforcement complaint-based under Ch. 223 Property Maintenance (IPMC); STR units inspected at registration"
  lead_rules: "federal pre-1978 disclosure (42 U.S.C. 4852d; 24 CFR 35 / 40 CFR 745) plus Maine Lead Poisoning Control Act, 22 MRS ch. 252: §1320 department inspection of dwelling units, §1321 notice and removal (abatement) orders, §1327 essential maintenance practices, §1331 lead-safe leased dwelling registry — section texts not read, chapter table of contents only; no Bangor-specific lead ordinance located"
  certificate_of_occupancy_rules: "none found — no Bangor point-of-sale or change-of-tenant occupancy inspection located (a 'Bangor occupancy inspection' PDF in search results is Bangor, MICHIGAN — not applicable)"
  security_deposit_limits: "max 2 months' rent (14 MRS §6032); return or itemized statement within 21 days (tenancy at will) or lease term not exceeding 30 days (§6033); landlord who misses the deadline forfeits the right to withhold any portion"
  local_landlord_taxes_fees: "none found — no Bangor rental registration fee or rental tax; property tax mill rate $17.13/$1,000 FY2027 plus $0.72 Downtown District (bangormaine.gov/160/Assessing); Bangor Ch. 282 bans rental application fees and caps screening fees at actual cost or $75, chargeable to successful applicants only"
  utility_obligations: "landlord may not make a tenant-at-will in a multi-unit building pay for common-area or other-unit utilities/heat absent a signed agreement with a rent reduction (14 MRS §6024; damages >= $250 + fees); implied warranty of habitability requires heating capable of 68F at -20F outdoors where landlord provides heat, min 62F by signed agreement with rent reduction (14 MRS §6021); electric/gas utilities may not disconnect residential customers Nov 15 - Apr 15 without PUC CASD approval (35-A MRS §718; PUC Ch. 815)"
