  - "Bangor Tenants' Housing Rights Ordinance (Ch. 282, eff. 2023-03-09): 60-day notice of ANY rent increase, application fees banned — slows rent repositioning after purchase"
  - "Maine winter utility disconnection prohibition Nov 15 - Apr 15 (35-A MRS §718) and 68F heating standard (14 MRS §6021) — landlord-paid heat in older 2-4 units is a real winter cash-flow exposure"
  - "Maine graduated income tax 5.8-7.15% on net rental income (plus a reported 2026 high-income surcharge that could not be read on the MRS page)"
