tax_rules:
  verified: true
  post_sale_treatment: "Maine property tax is assessed and collected by the MUNICIPALITY (City of Bangor), not Penobscot County. No reassessment-on-sale: the City Assessor runs an annual in-house STATISTICAL revaluation using a one-year sales-ratio study (assessed value / sale price) grouped by property class (incl. '1 to 4 Unit Residence' as its own class) and then by neighborhood, adjusting whole classes/neighborhoods so the median ratio lands ~91-100% (Jan 2025 memo: 1-4 unit median ratio was 83% before adjustment; taxable value raised 6.85% for April 1, 2025). A buyer's own sale enters the ratio sample but is not individually 'chased'. The first FULL citywide revaluation since the late 1980s (KRT Appraisal, interior/exterior inspection of every property) is effective April 1, 2026 and appears in the July 2026 (FY2027) commitment at 100% market value — a recently purchased 2-4 unit should expect assessed value near its purchase price from FY2027 onward. FY2027 mill rate $17.13/$1,000 (+$0.72 Downtown District); taxes due Sept 15 and Mar 15; 7% interest on late payments. Homestead exemption ($25,000) is owner-occupant only."
  risk: "MEDIUM"
  assessor_url: "https://bangormaine.gov/160/Assessing"
  treasurer_url: "https://bangormaine.gov/160/Assessing"    # City of Bangor Tax Collector/Treasury collects; dedicated treasury page URL not located (bangormaine.gov/treasury 404) — Assessing page carries due dates and rate; Penobscot County has no property tax assessor/collector role
  source_url: "https://bangormaine.gov/DocumentCenter/View/3165/Assessor---Finance-Committee-Update---February-2025-PDF"

