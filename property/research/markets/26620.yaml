tax_rules:
  verified: true
  post_sale_treatment: "No sale-triggered reassessment as such, but three mechanisms move the buyer's bill: (1) Madison County reappraises ALL property to fair market value annually under an Alabama DOR directive (since 2004-10-01), so a purchase price feeds the next sales-ratio study and new values are set each March/April with a 30-day appeal window to the Board of Equalization; (2) the Act 2024-344 7% annual cap on assessed-value increases (ALDOR Rule 810-4-1-.28) is REMOVED for the parcel in the year ownership changes (other than between family members or on death/foreclosure redemption), so any gap between capped taxable value and true value closes at once; (3) a rental loses Class III (10%) and is assessed as Class II (20%) — a homesteaded seller's bill doubles before any value change. Tax year runs Oct 1-Sep 30, paid in arrears; bills stay in the seller's name up to ~2 years. Huntsville millage 58.0; City of Madison 69.5."
  risk: "HIGH"
  assessor_url: "https://www.madisoncountyal.gov/departments/tax-assessor"
  treasurer_url: "https://www.madisoncountyal.gov/departments/tax-collector"
  source_url: "https://www.madisoncountyal.gov/departments/tax-assessor/faq"

