landlord_law:
  verified: false
  rent_control: "no — state preemption, KRS 65.875 ('only the General Assembly shall enact legislation which would control rents on private property', created 1992); also KRS 383.198 prohibits local landlord-tenant ordinances in conflict with state law. Louisville Metro has adopted the URLTA (KRS 383.500-383.705) as Metro Code Chapter 151"
  just_cause_eviction: "no — URLTA (adopted by Louisville Metro) has no just-cause requirement; nonpayment: 7-day written notice (KRS 383.660(2)); other material breach: 14-day notice to cure, 14-day notice to quit on repeat within 6 months (KRS 383.660(1)); month-to-month terminable on 30 days' written notice (KRS 383.695(2))"
  eviction_timeline_days: 7
  rental_licensing: "yes — Louisville Metro Code Chapter 119 Rental Housing Registry (Ord. 174-2016, overhauled 2022): all rental units register online with Codes & Regulations; one registration/fee per multi-unit facility; initial fee $25-$250 by zoning class ($25 for R-4/R-5); $50 nonrefundable annual renewal, WAIVED if no Ch. 156/119 violations in prior 12 months; change of ownership voids the registration after 30 days; failure to register $100/unit first offense, each day a separate offense"
  rental_license_fee_annual: 50
  inspection_frequency: "proactive (random) inspections since 2024-06-01 limited to 11 market areas where >33% of residents rent (2019 Housing Needs Assessment); new construction exempt 10 yrs, renovated units 5 yrs; elsewhere complaint-based; entry only with URLTA notice (KRS 383.615/383.665), administrative warrant, or occupant consent; Metro reported ~7,000 inspections planned in year one"
  lead_rules: "federal pre-1978 disclosure (EPA/HUD Section 1018) PLUS Louisville Metro Code Chapter 167 Lead-Safe Housing Registry (Ord. 183-2022): every pre-1978 rental unit registers with Public Health & Wellness ($30 initial fee per unit or per multi-unit facility; renewal fee not to exceed $50; renew by Dec 31 yearly; register within 30 days of acquisition), and must have a Lead-Hazard Evaluation + Lead-Hazard Control Report by a Kentucky-certified Lead-Hazard Risk Assessor — pre-1940 units within 12 months of effect, 1940-1965 within 24 months, 1966-1977 within 36 months (press: deadlines 2025-11-30 / 2026-11-30 / 2027-11-30); renovation/RRP-based exemption available; notice of noncompliance then citation after 30 days"
  certificate_of_occupancy_rules: "no point-of-sale CO or rental inspection-on-sale requirement found for Louisville Metro; the Ch. 119 registration must be re-filed by the new owner within 30 days of transfer and a Ch. 167 lead registration within 30 days of acquisition"
  security_deposit_limits: "no statutory cap on amount (KRS 383.580); deposit must be held in a separate account at a KY- or federally-regulated institution and tenant told the location and account number; signed move-in and move-out damage listings required or landlord forfeits right to retain ANY of the deposit (383.580(4)); landlord may apply deposit to unpaid rent after 30 days; refund notice to last known address, deposit retained if no response in 60 days"
  local_landlord_taxes_fees: "Ch. 119 registry $50/yr (waivable) + Ch. 167 lead registry $30 initial / <= $50 renewal for pre-1978 units; no Louisville-specific landlord tax found; Louisville Metro occupational license tax applies to net profits of businesses (rate for rental income not researched — UNKNOWN)"
  utility_obligations: "landlord must maintain electrical, plumbing, sanitary, heating, ventilating, A/C and supplied appliances, and supply running water, reasonable hot water at all times and reasonable heat Oct 1-May 1 unless the unit's heat/hot water is generated by an installation under the tenant's exclusive control with a direct public-utility connection (KRS 383.595(1)(d)-(e)); single-family tenants may assume these duties by good-faith written agreement (383.595(3))"
