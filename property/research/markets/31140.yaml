tax_rules:
  verified: true
  post_sale_treatment: "Kentucky assesses at 100% fair cash value as of Jan 1 (KY Const. s.172). Jefferson County PVA values ~260,000 residential parcels annually by a sales (market) approach: sales are researched and verified every year, valid arm's-length sales feed the CAMA model, and per the PVA 'an accepted sale price represents the property value for approximately 2 years.' A sale also automatically assigns a PVA field inspection (exterior measure/photo; no interior entry). Separately the DOR-approved Quadrennial Plan physically reviews every parcel at least once every 4 years (KRS 132.690(1)) and Louisville Metro neighborhoods are reviewed annually. Net effect: the buyer's assessment moves to roughly the purchase price in the first or second assessment year after closing — a seller's under-assessed bill is never the buyer's. No rental vs. owner-occupied classification difference in KY (homestead exemption only for 65+/disabled). Bills issued by the Jefferson County Sheriff ~Nov 1 (2% discount through Dec 1; unpaid after Apr 15 go to County Clerk)."
  risk: "HIGH"
  assessor_url: "https://jeffersonpva.ky.gov/"
  treasurer_url: "https://jeffersonsheriffky.gov/property-tax"
  source_url: "https://jeffersonpva.ky.gov/property-assessment/residential-property/"

