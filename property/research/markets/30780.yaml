landlord_law:
  verified: false    # city ordinance/registration documents read on littlerock.gov and the AG page read directly; state statute texts read on FindLaw (current as of 2024-03-28), not on the official arkleg.state.ar.us code — so not marked verified
  rent_control: "no — Ark. Code 14-16-601 and 14-54-1409: a local governmental unit (county, city, village, township) shall not enact, maintain, or enforce an ordinance or resolution that would have the effect of controlling the amount of rent charged for leasing private residential or commercial property; no local rent control exists"
  just_cause_eviction: "no — civil unlawful detainer, Ark. Code 18-60-304: holdover after the term, holdover after written demand, or nonpayment plus three (3) days' notice to quit and written demand for possession; tenant has 5 days after summons to file a written objection or the sheriff may remove (Arkansas AG); separate criminal failure-to-vacate statute, Ark. Code 18-16-101: 10 days' written notice to vacate, willful refusal is a misdemeanor, $1-$25 per day, each day a separate offense"
  eviction_timeline_days: null
  rental_licensing: "yes — City of Little Rock Rental Housing Registration Program (Housing & Neighborhood Programs): every rental dwelling unit registered annually (registration good until Dec 31); owner/manager with 3 or fewer units pays $35/yr flat; 4 or more units pays $200 base + $7/unit for the first 100 units (+$3.50/unit beyond); duplex = 2 units, triplex = 3; failure to register = penalties/municipal fine. Fee schedule from a 2014 city flyer — confirm current amounts at 501-371-4849"
  rental_license_fee_annual: 35
  inspection_frequency: "Systematic Rental Inspection Program, Little Rock Rev. Code ch. 8 art. IX §§ 8-577 to 8-586 (Ord. 16,659 of 1994, amended 2019-09-17 effective 2020-01-01): random systematic inspection of 20% of registered rental units each year (about a 5-year cycle); additional inspection when title to the unit is conveyed or transferred (§ 8-582(4)), on complaint, after fire/storm, or at owner request; newly built units exempt from the random cycle for 5 years"
  lead_rules: "federal only found: pre-1978 lead-based paint disclosure (42 U.S.C. 4852d; 24 CFR 35 / 40 CFR 745); no Little Rock-specific lead ordinance located"
  certificate_of_occupancy_rules: "no certificate-of-occupancy-on-sale requirement found; but § 8-582(4) subjects a rental unit to a city rental inspection when title is conveyed or transferred, so a purchased 2-4 unit should expect an inspection against the Housing Code (ch. 8 art. V)"
  security_deposit_limits: "Ark. Code 18-16-304: no more than two (2) months' periodic rent, however denominated; 18-16-305: return within 60 days of termination with itemized deductions (per Arkansas AG); 18-16-303: the subchapter does not apply to an individual owning five or fewer dwelling units unless a third party manages/collects rent for a fee — a self-managed 2-4 unit is outside the cap"
  local_landlord_taxes_fees: "none found beyond the annual rental registration fee; no city rental-income or per-unit tax located; real property assessed at 20% of market value statewide; Pulaski County millage applies"
  utility_obligations: "Ark. Code 18-17-502 (Act 1052 of 2021; leases entered/renewed after 2021-11-01): landlord must supply hot and cold running water, electricity, potable water, sanitary sewer/plumbing to code, a functioning roof and building envelope, and functioning heating and A/C to the extent they served the premises at signing; tenant gives written notice (certified mail) and, if rent is current and the landlord does not remedy within 30 calendar days, the tenant's sole remedy is termination without penalty plus deposit refund — no rent withholding; stricter local housing codes still apply (18-17-502(h))"
