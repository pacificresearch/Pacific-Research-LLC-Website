tax_rules:
  verified: true
  post_sale_treatment: "Arkansas assesses real property at 20% of market value, reappraised county-wide every 4 years (Act 139 of 2023; Pulaski County's current cycle ended 2026 per the AACD 2025 Annual Report). Amendment 79 § 1(b) limits a NON-homestead parcel's taxable-value increase after reappraisal to 10%/yr, but the cap belongs to the seller: Ark. Code 26-26-1123(a)-(b) requires the assessor to assess a sold parcel at 20% of full appraised value at the next assessment date after transfer, and the new owner is not entitled to claim any limitation until the second assessment date after transfer (ACD Amendment 79 Assessor's Guide states the same rule). A 2-4 unit bought from a long-held owner therefore resets to full market value the following Jan 1 — the current owner's bill is never the post-purchase bill. Homestead credit ($500, $600 from 2026 bills) and 5% cap apply only to an owner-occupied unit."
  risk: "HIGH"
  assessor_url: "https://pulaskicountyassessor.net/"
  treasurer_url: "https://www.pulaskicountytreasurer.net/"
  source_url: "https://www.dfa.arkansas.gov/wp-content/uploads/AACD_AnnualReport_2025.pdf"

