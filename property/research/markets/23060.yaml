landlord_law:
  verified: false
  rent_control: "no — state preemption, IC 32-31-1-20(b): a unit may not regulate rental rates for privately owned real property (including through zoning) unless authorized by state act; (c) also bars local regulation of tenant screening, security deposits, lease applications/terms, disclosures, and landlord fees — any violating ordinance 'is void and unenforceable'"
  just_cause_eviction: "no — no just-cause statute; nonpayment: landlord may terminate on not less than 10 days' written notice unless the lease provides otherwise or rent is paid within the period (IC 32-31-1-6); month-to-month tenancy terminable on at least one month's notice (IC 32-31-1-1); court (ejectment/small-claims) timeline after notice UNKNOWN from a primary source"
  eviction_timeline_days: 10
  rental_licensing: "yes — City of Fort Wayne Neighborhood Code Compliance: 'all owners of residential property who do not occupy the property themselves must register the property' by filing a Housing Registration Form 'required by City ordinance' (cited by secondary sources as City Code Ch. 150); fee amount, renewal cycle and out-of-state local-agent rule NOT confirmed from the city page (403 to this session) — UNKNOWN"
  rental_license_fee_annual: null
  inspection_frequency: "complaint-based Neighborhood Code enforcement; no periodic rental inspection program found (Indiana IC 36-1-20 limits municipal rental inspection/registration programs statewide); a secondary site claims exterior inspection at registration — unverified"
  lead_rules: "federal only (pre-1978 housing: EPA/HUD Section 1018 disclosure — pamphlet, known-hazard disclosure, Lead Warning Statement, records kept 3 years); no Fort Wayne or Allen County lead-registry ordinance found"
  certificate_of_occupancy_rules: "no point-of-sale certificate of occupancy or rental inspection-on-sale requirement found for Fort Wayne; the Housing Registration Form must be filed by the new non-occupant owner"
  security_deposit_limits: "no statutory cap on amount; landlord must return the deposit less itemized deductions (unpaid rent, tenant-caused damage, unpaid tenant utilities/sewer) with a written itemized notice within 45 days of termination and delivery of possession, once tenant supplies a mailing address; noncompliance forfeits the right to withhold anything and exposes landlord to the full deposit plus attorney's fees (IC 32-31-3-12 to -14); successor owner is bound"
  local_landlord_taxes_fees: "no Fort Wayne landlord tax found; rentals are capped at 2% of gross AV (homestead 1%) and do not receive the homestead deductions — the main 'landlord premium' is property-tax classification, not a fee; registration fee UNKNOWN"
  utility_obligations: "landlord must deliver the unit 'in a safe, clean, and habitable condition', comply with health/housing codes, and keep in good and safe working order the electrical, plumbing (reasonable hot and cold water at all times), sanitary, HVAC (heat 'at all times') systems, elevators and inducement appliances supplied at signing (IC 32-31-8-5); who pays utility bills is left to the lease; tenant utility arrears may be deducted from the deposit (IC 32-31-3-13)"
  sources:
    - "https://iga.in.gov/laws/2025/ic/titles/32#32-31-1-20"
    - "https://codes.findlaw.com/in/title-32-property/in-code-sect-32-31-1-20/"
    - "https://codes.findlaw.com/in/title-32-property/in-code-sect-32-31-1-6/"
    - "https://codes.findlaw.com/in/title-32-property/in-code-sect-32-31-3-12/"
    - "https://codes.findlaw.com/in/title-32-property/in-code-sect-32-31-8-5/"
    - "https://www.cityoffortwayne.in.gov/code-compliance"
    - "https://www.epa.gov/lead/real-estate-disclosures-about-potential-lead-hazards"

tax_rules:
  verified: true
  post_sale_treatment: "Indiana has no sale-triggered reassessment to price: assessed value (Jan 1, market value-in-use) is 'trended' every year by a neighborhood factor derived from the prior calendar year's valid sales (DLGF Annual Adjustment fact sheet 2025-11; Allen County used 1/1/2025-12/31/2025 sales for the 2026 roll), and every parcel is physically inspected once per 4-year cyclical reassessment (25%/yr; Wayne Township — core Fort Wayne — was in Phase 4 for 2026). BUT the sale itself matters three ways: (1) every Sales Disclosure Form is validated with buyer/seller calls, MLS review and a mandatory field inspection (50 IAC 27-3-1), and the assessor 'has no choice but to update' the record for unpermitted finish, remodels and basement finish found — effective-age recalculation is 'more widespread' in Wayne Township; (2) Allen County values residential RENTAL property on a gross-rent-multiplier model, so disclosed rents drive the number; (3) classification: a non-owner-occupied unit loses the homestead standard + supplemental deductions and moves from the 1% to the 2% circuit-breaker cap (owner-occupied 2-4 unit: homestead/1% on the owner's dwelling share only), so a duplex bought from a homesteaded seller can roughly double in tax before any AV change. Bills are paid in arrears in two installments (~May 10 / Nov 10) to the Allen County Treasurer."
  risk: "MEDIUM"
  assessor_url: "https://www.allencounty.us/assessor"
  treasurer_url: "https://www.allencounty.us/treasurer"
  source_url: "https://www.in.gov/dlgf/files/2027-reports/2026-ratio-studies/ALLEN-2026-NARRATIVE.pdf"
  # risk is HIGH when the seller was homesteaded (1%->2% cap + lost deductions), LOW-MEDIUM when buying from another investor. allencounty.us was unreachable from this session; the two county URLs above are the department landing paths and were not opened — the DLGF-published Allen County narrative (source_url) and DLGF fact sheets https://www.in.gov/dlgf/files/user-guides/251113-Fact-Sheet-Annual-Adjustments.pdf and https://www.in.gov/dlgf/files/user-guides/251113-Fact-Sheet-Circuit-Breaker-Caps.pdf were read.

