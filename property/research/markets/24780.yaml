tax_rules:
  verified: true
  post_sale_treatment: "No reassessment on sale. NC counties hold the value set at the last general reappraisal until the next one; G.S. 105-287(b) forbids interim changes for 'inflation, deflation, or other economic changes affecting the county in general' (only physical changes, use changes or errors). Pitt County reappraises every 4 years (statutory max 8, G.S. 105-286); current values effective 2024-01-01 from 2022-23 sales; next reappraisal effective 2028-01-01. A buyer inherits the 2024 value through the FY2027-28 bill, then resets in 2028."
  risk: "MEDIUM"                  # 2028 reset is 13 months out and will capture 2022→2027 appreciation; rate is re-set by commissioners each June and may or may not be revenue-neutral
  assessor_url: "https://www.pittcountync.gov/1160/Real-Property-Valuations-Land-Records"
  treasurer_url: "https://www.pittcountync.gov/465/Tax-Administration"
  source_url: "https://www.pittcountync.gov/1160/Real-Property-Valuations-Land-Records"

