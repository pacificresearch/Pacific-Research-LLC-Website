tax_rules:
  verified: true
  post_sale_treatment: "No reassessment-on-sale event, but Ector CAD states it 'uses an annual reappraisal cycle' — every property is appraised each year at market value as of Jan 1 by comparison to recent sales (ECAD FAQ; Reappraisal Plan 2027/2028), so a recorded sale price feeds the next Jan 1 appraisal. The 10% homestead cap belongs to an owner-occupant seller and 'automatically expires as of January 1st of the year following the sale' with the property appraised at market (ECAD plan; Tax Code §23.23), so a 2-4 unit bought from a homesteaded owner can jump. Non-homestead real property <= ~$5M (CPI-adjusted) gets a 20% annual circuit-breaker cap (§23.231) but not in the first year of new ownership, and the statute expires 2026-12-31 unless extended."
  risk: "HIGH"
  assessor_url: "https://www.ectorcad.org/"
  treasurer_url: "https://www.ectorcad.org/index.php"    # county Tax Assessor-Collector page (ectorcountytx.gov/189) points property-tax matters to ECAD; county office handles motor vehicles/HOT
  source_url: "https://www.ectorcad.org/pdf/faq.pdf"

