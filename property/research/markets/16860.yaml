landlord_law:
  verified: false                # statute text read from a code-publisher compilation (CAATN URLTA 2025 PDF; FindLaw for 66-35-102), not capitol.tn.gov; city items from chattanooga.gov pages. Chattanooga City Code not searched section-by-section.
  rent_control: "no — state preemption, Tenn. Code Ann. 66-35-102(a): a local governmental unit shall not enact, maintain or enforce an ordinance or resolution controlling the amount of rent for private residential or commercial property; subsection (b) (added 2024, Pub. Ch. 1051, eff. 2024-07-01) also bars mandatory below-market / inclusionary requirements; voluntary incentive programs allowed"
  just_cause_eviction: "no — Tennessee URLTA (66-28, applies in Hamilton County: counties >75,000 pop. per 2010 census, 66-28-102) has no just-cause requirement. Month-to-month terminable by either party on 30 days' written notice (66-28-512(b)); week-to-week 10 days. Nonpayment/curable breach: 14-day notice to cure or terminate (66-28-505(a)(2)), 7 days on repeat within 6 months; non-curable breach 14 days (505(a)(3)); 3-day termination for violence, drug activity or hazardous conditions (66-28-517). 2025 bills HB1345/SB1088 to cut 14 days to 7 FAILED. Court (detainer warrant, Hamilton County General Sessions) timeline after notice: UNKNOWN"
  eviction_timeline_days: null
  rental_licensing: "no — no City of Chattanooga long-term rental registration, license or periodic rental-inspection program found on city pages (Code Enforcement is a division of the Land Development Office enforcing the minimum housing code; short-term vacation rentals are a separate certificate under Ordinance 13981). State landlord-registration statute 66-28-107 applies ONLY to metropolitan governments >500,000 (66-28-107(c)) — Nashville, not Chattanooga"
  rental_license_fee_annual: null
  inspection_frequency: "no routine rental inspection cycle. Complaint-driven via 311 (notice of violation; 10 days to cure, 30 for housing; re-inspection; then citation to court). From 2025-11 the City runs proactive two-day inspection sweeps by Council district (Districts 1,2,7,3,4,8 scheduled Nov 2025-Jan 2026) issuing NOVs for litter, overgrowth, inoperable vehicles and structure violations, with two weeks to correct"
  lead_rules: "federal only (pre-1978 housing: EPA/HUD Section 1018 — EPA pamphlet, disclosure of known lead-based paint/hazards and records, Lead Warning Statement in lease, records kept 3 years); no City of Chattanooga or Hamilton County lead ordinance found"
  certificate_of_occupancy_rules: "no point-of-sale certificate of occupancy or rental inspection on sale found for Chattanooga (city code enforcement pages silent) — UNKNOWN pending a City Code check"
  security_deposit_limits: "no statutory cap. Deposits must be held in a dedicated account at a TN/federally regulated institution and the tenant told the account location at signing (66-28-301(a),(h)); tenant has right to a move-out inspection and itemized damage list; landlord forfeits right to retain any deposit if not held in the required account or no damage list (301(c)); refund notice to last known address, unclaimed after 60 days reverts to landlord (301(f)); later-discovered damage recoverable only if found within 30 days of vacancy or 7 days after a new tenant (301(g))"
  local_landlord_taxes_fees: "none Chattanooga-specific found for long-term rentals (STR certificate fee applies only to short-term rentals). Statewide: 66-28-302 (as amended by the 2024 'Landlord Transparency Act', SB1694/HB1814, eff. 2025-01-01 — chaptered text not read) requires written disclosure of managing agent, owner/agent for service of process, and a maintenance phone/email or online portal. Property tax: Hamilton County + City of Chattanooga both levy; 2026 rates not read (Trustee links a 'Current Property Tax Rates' PDF) — UNKNOWN"
  utility_obligations: "URLTA 66-28-304(a): landlord must comply with building/housing codes affecting health and safety, keep premises fit and habitable, keep common areas clean and safe, and in complexes of 4+ units provide waste receptacles; no statutory requirement that landlord pay utilities — allocation is by lease. EPB (municipal) supplies electric and fiber; water provider (Tennessee American Water) tariffs not read"
  sources:
    - "https://codes.findlaw.com/tn/title-66-property/tn-code-sect-66-35-102/"
    - "https://assets-002.noviams.com/novi-file-uploads/caatn/URLTA_2025.pdf"
    - "https://wapp.capitol.tn.gov/apps/BillInfo/Default.aspx?BillNumber=SB1088&GA=114"
    - "https://chattanooga.gov/government/public-works/code-enforcement"
    - "https://register.chattanooga.gov/stay-informed/latest-news/city-announces-comprehensive-code-enforcement-inspection-schedule-enhance"
    - "https://chattanooga.gov/public-works/land-development-office/short-term-vacation"
    - "https://www.epa.gov/lead/real-estate-disclosures-about-potential-lead-hazards"

tax_rules:
  verified: true
  post_sale_treatment: "No sale-triggered reassessment in Tennessee. Hamilton County reappraises every four years: last reappraisal 2025, next 2029-01-01 (Assessor: 'NEXT PROPERTY VALUE REAPPRAISAL IS JANUARY 1, 2029'; Comptroller schedule: LAST 2025 / NEXT 2029 / cycle 4). Between reappraisals value changes only for physical changes; market value is set from comparable arm's-length sales at reappraisal. Residential/rental real property assessed at 25% of appraised value. Comptroller 2026 appraisal ratio 1.0000 (values at market after the 2025 reappraisal), so a 2026-27 buyer's bill should track the seller's until the 2029 reset, when the county/city rates are recertified revenue-neutral (67-5-1701). Trustee collects Oct 1 through last day of Feb; delinquent Mar 1 at 1.5%/month"
  risk: "LOW"
  assessor_url: "https://hamiltontn.gov/AssessorOfProperty.aspx"
  treasurer_url: "https://hamiltontn.gov/Trustee.aspx"
  source_url: "https://comptroller.tn.gov/office-functions/pa/tax-resources/assessment-information-for-each-county/reappraisal-schedule.html"

