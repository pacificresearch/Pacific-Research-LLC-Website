tax_rules:
  verified: true
  post_sale_treatment: "No sale-triggered reassessment in Ohio. Cuyahoga County reappraises all real property every six years by state-licensed appraisers (last sexennial reappraisal 2024, values effective tax year 2024 / bills payable 2025) with a triennial update between; the Ohio Department of Taxation's 2026-01-15 bulletin moved Cuyahoga's next reappraisal to 2031, and the interim update year is not stated (assume 2027). Market sales feed neighborhood-level mass appraisal at those updates, not a per-parcel reset at closing. A buyer's own arm's-length price can still be used against them only through a Board of Revision complaint: HB 126 (134th GA, 2022) bars school boards from filing original complaints unless the sale was in the prior year AND exceeded the auditor's value by both >10% and >$500,000 (indexed), so a sub-$400K 2-4 unit purchase is effectively shielded from school-board price complaints. Owners may file their own complaint Jan 1-Mar 31 (DTE Form 1). Two things do move the buyer's bill at once: loss of the 2.5% owner-occupancy credit if the seller was owner-occupied, and any homestead exemption the seller held. Taxes are paid in arrears (first half due ~Jan/Feb, second half ~Jul)."
  risk: "LOW"
  assessor_url: "https://www.cuyahogacounty.gov/fiscal-officer"
  treasurer_url: "https://cuyahogacounty.gov/treasury"
  source_url: "https://content.govdelivery.com/accounts/OHTAX/bulletins/4048d9f"

