landlord_law:
  verified: true
  rent_control: "no — state preemption, ORC 5321.19(A) as amended by HB 430 (134th GA, eff. 2022-09-23): political subdivisions may not regulate rental terms 'including, without limitation, by any way imposing or requiring rent control or rent stabilization'; ORC 5321.20 declares it a matter of statewide concern"
  just_cause_eviction: "no — Ohio has no just-cause requirement; forcible entry and detainer (ORC Ch. 1923) requires a 3-day notice to leave with statutory language (ORC 1923.04(A)); hearing on possession set per local court rules but not sooner than 7 days after service is complete (ORC 1923.06(H)(1))"
  eviction_timeline_days: 21   # statutory shape: 3-day notice (1923.04) + service + hearing ≥7 days after service (1923.06) + writ/set-out — a ~3-week uncontested path is the statutory floor, not a measured median
  rental_licensing: "yes — City of Cleveland Rental Registration, all non-owner-occupied residential units, $70 per unit per year (CCO 365.03), renew annually with fees due by March 31; Certificate Approving Rental Occupancy required to rent in good standing; HVAC certificate/inspection for 4+ unit buildings; Lakewood: annual 'housing license' renewal due November 1 (fee not published on page); Parma: registration/inspection per Parma Codified Ordinances Ch. 1345 reported by a third-party guide — NOT confirmed on a city page (UNKNOWN)"
  rental_license_fee_annual: 70
  inspection_frequency: "Cleveland: no routine interior inspection cycle on 1-3 unit rentals found; lead risk assessment every 2 years for pre-1978 rentals (Lead Safe Certificate) and HVAC inspection only for 4+ unit buildings; otherwise complaint-based Building & Housing enforcement. Lakewood: point-of-sale, rental and complaint-based inspections (no fixed cycle stated)"
  lead_rules: "federal pre-1978 disclosure (EPA/HUD) PLUS City of Cleveland Lead Safe Certification (2019 council legislation): every pre-1978 non-owner-occupied rental unit must hold a Lead Safe Certificate or exemption — risk assessment by a licensed assessor (inspections start ~$350), certificate valid 2 years then re-apply, or 20-year exemption after full abatement + LIRA; no city application fee; remediation plan due within 90 days if hazards found; LSC# needed to finalize rental registration; an owner-occupied unit in a multi-unit building is exempt (other units are not)"
  certificate_of_occupancy_rules: "Cleveland: no point-of-sale inspection found; Certificate Approving Rental Occupancy issued through registration. Lakewood: since 2019-09-01 a certificate of code compliance (formerly CO) is required before selling a non-owner-occupied residential rental, after a point-of-sale inspection of interior, exterior and yard (L.C.O. 1173.01 / 1306.53). Parma: UNKNOWN"
  security_deposit_limits: "no statutory cap (ORC 5321.16); 5% annual interest owed on any portion exceeding the greater of $50 or one month's rent if tenancy lasts 6+ months; itemized deductions and balance returned within 30 days of termination + delivery of possession; wrongful withholding = amount withheld as damages plus attorney fees (tenant must give forwarding address)"
  local_landlord_taxes_fees: "no landlord-specific tax found; $70/unit/yr Cleveland rental registration; non-owner-occupied units are not eligible for Ohio's owner-occupancy credit (2.5% rollback) listed by the County Fiscal Officer; Cleveland municipal income tax applies to net rental income of residents/nonresidents with Cleveland rentals (rate not verified here)"
  utility_obligations: "landlord must supply running water, reasonable amounts of hot water and reasonable heat at all times, except where the tenant controls the heat/hot-water installation supplied by a direct public utility connection, and must keep all electrical, plumbing, sanitary, heating, ventilating and A/C fixtures the landlord supplies in good and safe working order (ORC 5321.04(A)(4),(6))"
