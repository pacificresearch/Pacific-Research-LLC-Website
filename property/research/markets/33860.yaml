tax_rules:
  verified: true
  post_sale_treatment: "No sale-triggered reassessment as such, but three mechanisms move the buyer's bill: (1) Montgomery County Revenue Commissioner appraises at fair market value by mass appraisal under Act 160 and mails valuation notices to all owners every year (2026 notices ~April 15); values move on 'sales review indicating the market has increased in value for that neighborhood' using the prior Oct 1-Sep 30 sales window, with a 30-day, no-fee appeal to the Board of Equalization; (2) the Act 2024-344 7% annual cap on assessed-value increases (ALDOR Rule 810-4-1-.28) is REMOVED for the parcel in the year ownership changes (other than between family members or on death/foreclosure redemption), so any gap between capped taxable value and true value closes at once; (3) a rental loses Class III (10%) and is assessed as Class II (20%) — a homesteaded seller's bill doubles before any value change. Tax year Oct 1-Sep 30, lien date Oct 1, paid in arrears (due Oct 1, delinquent after Dec 31)."
  risk: "HIGH"
  assessor_url: "https://www.montgomerycountyal.gov/departments/appraisal"
  treasurer_url: "https://www.mc-ala.org/departments/property-tax"
  source_url: "https://www.montgomerycountyal.gov/departments/appraisal/appeals/frequently-asked-questions"

