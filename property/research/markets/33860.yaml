  verified: true
  rent_control: "no — state preemption, Ala. Code 11-80-8.1 (no local governmental unit may enact, maintain or enforce any ordinance, resolution or rule controlling the amount of rent charged for leasing private property; Acts 1993 No. 93-421)"
  just_cause_eviction: "no — Alabama Uniform Residential Landlord and Tenant Act (Ala. Code Title 35 Ch. 9A) has no just-cause requirement; termination for breach governed by 35-9A-421"
  eviction_timeline_days: 7
  rental_licensing: "no adopted ordinance — City of Montgomery announced 2026-04-02 it is developing a rental property registration system and vacant building registration framework ('still in development'; no fee, inspection or effective date published); UNKNOWN whether a general city business license is required of a small landlord"
  rental_license_fee_annual: null
  inspection_frequency: "no routine rental inspection cycle found; any inspection regime would come with the proposed 2026 registration system (not yet published)"
  lead_rules: "federal only (pre-1978 housing: EPA/HUD Section 1018 disclosure — pamphlet, known-hazard disclosure, available reports, Lead Warning Statement in lease, signed records kept 3 years); no City of Montgomery or Montgomery County lead ordinance found"
  certificate_of_occupancy_rules: "no point-of-sale certificate of occupancy or rental inspection requirement found for City of Montgomery"
  security_deposit_limits: "capped at one month's periodic rent, except for pets, alterations or increased liability risk (35-9A-201(a)); itemized return within 60 days of termination and delivery of possession; landlord who misses the 60 days owes double the deposit (35-9A-201(f))"
