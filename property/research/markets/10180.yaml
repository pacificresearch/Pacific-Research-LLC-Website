tax_rules:
  verified: true
  post_sale_treatment: "No reassessment-on-sale event, but Taylor CAD's stated policy is a general reappraisal of ALL taxable real property at 100% market value EVERY year (Reappraisal Plan 2025-2026, citing Tax Code §25.18 three-year minimum) and the CAD calls a sale price a strong indication of market value, so a buyer should expect the Jan 1 appraisal after closing to move toward the purchase price. The 10% homestead cap belongs to the owner-occupant seller and expires Jan 1 after a sale (property re-appraised at market), so a 2-4 unit bought from a homesteaded owner can jump. Non-homestead real property <= ~$5M (CPI-adjusted) gets a 20% annual circuit-breaker cap (Tax Code §23.231), but it does not apply in the first year of new ownership and the statute expires 2026-12-31 unless the Legislature extends it."
  risk: "HIGH"
  assessor_url: "https://taylor-cad.org/"
  treasurer_url: "https://taylor-cad.org/"    # Taylor CAD also collects property tax for all Taylor County jurisdictions; county Tax Assessor-Collector handles motor vehicles only (comptroller directory: https://comptroller.texas.gov/taxes/property-tax/county-directory/taylor.php)
  source_url: "https://taylor-cad.org/wp-content/uploads/2025/11/Reappraisal-Plan-Taylor-CAD-2025_2026-Final.pdf"

