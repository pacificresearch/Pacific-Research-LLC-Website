risks:
  - "Philadelphia Wage/Earnings Tax (3.74% resident from 2025-07-01, 3.735% from 2026-07-01) stacks on the 3.07% PA flat tax — an owner-occupant investor pays both; rental net profits are also subject to the city Net Profits Tax/BIRT"
  - "Good-cause tenancy rule (Code 9-804(12), Bill 250330-AA eff. 2026-11-01) now covers ALL residential leases at expiration, not just leases under one year; the only exemption is a landlord who lives in the same individual unit — a 2-4 unit owner-occupant does NOT qualify. Non-renewal to re-tenant at market rent needs a listed good cause or 60-day notice tied to a bona fide owner-occupant sale"
  - "Mandatory Eviction Diversion Program (Code 9-811): landlord must serve a Notice of Diversion Rights and wait 30 days before filing in Municipal Court — adds a month to every nonpayment eviction"
  - "Philadelphia OPA citywide revaluations (TY2025, TY2027) are driven by sales; some neighborhoods saw assessment jumps over 50% for TY2027 — a purchase above current assessment is likely to be marked up at the next revaluation"
  - "76ers Market East arena ($1.3B) was CANCELLED 2025-01; the replacement South Philadelphia arena (Comcast Spectacor JV, target 2031) has no approvals or construction yet"
  - "Spark Therapeutics (Roche) cut 337 of ~650 Philadelphia jobs in 2025 while finishing its $575M Gene Therapy Innovation Center — life-sciences employment is softer than the construction pipeline suggests"
  - "FIFA World Cup 2026 matches and the 2026 semiquincentennial (America250) are ONE-TIME events — hospitality demand bump only; never model as recurring rent support"
  - "Rental License requires proof of legal occupancy (CO, prior rental license within 3 years, or zoning permit + Affidavit of Continuous Use) — an unlicensed 'triplex' may not be legally licensable at that unit count"
