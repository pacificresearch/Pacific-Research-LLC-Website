landlord_law:
  verified: false                # most items trace to phila.gov / Municipal Court / certified bill text read this run; rent_control (absence of a PA statute), the 30-day deposit return cite, and 4-year lead-cert validity were not read from a primary page this run
  rent_control: "no — Philadelphia has no rent control. Pennsylvania has NO statewide rent-control preemption statute (preemption bills HB 2190 of 2019-20 and HB 136 of 2021-22 died in committee); municipal authority to enact rent control is untested rather than barred"
  just_cause_eviction: "yes — Philadelphia Code 9-804(12) 'Good cause required': as amended by Bill 250330-AA (passed 2026-04-23, signed 2026-05-07, effective 2026-11-01) a landlord may not take any action to terminate ANY residential tenancy at lease expiration (notice to vacate/non-renewal, Notice of Diversion Rights, or filing for possession) without listed good cause and written notice of the cause on the rent-increase notice schedule; failure to notice renews the lease month-to-month. Good causes include 68 P.S. 250.501(a)(2)/(3) grounds and a bona fide arm's-length sale to a purchaser who will owner-occupy within 90 days (60 days' notice + documents). Sole exemption: landlord occupies the SAME individual rental unit as primary residence since tenancy start — a 2-4 unit owner-occupant is NOT exempt. Remedies: statutory $1,000/violation, treble for willful, attorney fees, rental-license suspension"
  eviction_timeline_days: null   # components read from primary: notice to quit 10 days (nonpayment) / 15 days (lease <= 1 yr, other breach or expiry) / 30 days (lease > 1 yr) under 68 P.S. 250.501 unless lease waives; THEN mandatory Eviction Diversion Program with 30-day wait before filing (60 days if TFA rent assistance paid); then Municipal Court hearing, judgment, writ. Total filing-to-lockout not published — UNKNOWN
  rental_licensing: "yes — Rental License $69/unit/yr, maximum $27,830 per building, no fee for owner-occupied units; renewed annually (late fee 1.5%/month after 60 days). Prerequisites: BIRT tax account + Commercial Activity License (Activity License Number only if owner-occupies and rents 3 or fewer units), zoning approval, proof of legal occupancy, named local managing agent"
  rental_license_fee_annual: 69
  inspection_frequency: "no routine city inspection cycle — L&I inspects on complaint. Owner must obtain a Certificate of Rental Suitability from L&I issued no more than 60 days before lease start and give it, with the Partners in Good Housing handbook, to every new tenant (not renewals); also bed-bug notice/120-day history and smoking policy (3+ units)"
  lead_rules: "federal pre-1978 disclosure PLUS Philadelphia Lead Paint Disclosure and Certification Law: any rental built before March 1978 must be certified lead-safe or lead-free (certified inspector report filed with Dept. of Public Health) to obtain/renew the Rental License and at each new lease — phase-in to ALL rentals complete since 2020-10-01; post-March-1978 buildings file an exemption. Lead-safe certificate validity 4 years per phila.gov Nov-2023 Rental License Requirements sheet (lead-free is permanent)"
  certificate_of_occupancy_rules: "no point-of-sale inspection or transfer CO. To license units an owner must prove legal occupancy: Certificate of Occupancy, OR a rental license issued within the past 3 years for the same unit count with no occupancy change, OR (use established before 2000) zoning permit + Affidavit of Continuous Use. Rental License is not transferred on sale — buyer re-licenses; Code 9-804(3): transfer of title does not alter the new owner's obligations under Ch. 9-800"
  security_deposit_limits: "68 P.S. 250.511a: max 2 months' rent in first lease year, 1 month in second and later years; after 5 years' occupancy rent increases cannot require a deposit increase; residential only, tenant waiver void. Return with itemized list within 30 days (250.512; double damages for wrongful withholding) and escrow/interest rules for deposits held over 2 years (250.511b) — 512/511b not read this run"
  local_landlord_taxes_fees: "Philadelphia Business Income & Receipts Tax (BIRT) and Net Profits Tax on rental income (BIRT account required for the Rental License unless owner-occupied with 3 or fewer rented units); School Income Tax on resident unearned income; Rental License $69/unit; lead certification inspection cost; Realty Transfer Tax (city + state) on purchase — rate not verified this run"
  utility_obligations: "Partners in Good Housing / Property Maintenance Code: owner must provide and maintain heating, hot and cold water, plumbing and electrical systems and pay for any utility not expressly assigned to the tenant in the lease; Philadelphia Water Department charges lien the property regardless of who is billed — specific code sections not read this run"
  sources:
    - "https://www.phila.gov/services/permits-violations-licenses/get-a-license/business-licenses/rental-and-property/get-a-rental-license/"
    - "https://www.phila.gov/services/property-lots-housing/buy-sell-or-rent-a-property/information-about-renting/rent-your-property-long-term/"
    - "https://phila.gov/departments/fair-housing-commission/tenant-protections/rental-suitability"
    - "https://files.amlegal.com/pdffiles/Philadelphia/250330-AA.pdf"
    - "https://www.courts.phila.gov/pdf/brochures/mc/LANDLORD-TENANT-PAMPHLET.pdf"
    - "https://www.phila.gov/media/20260212170051/landlord-gateway-eviction-diversion-program-presentation-2026-01-08.pdf"
    - "https://codes.findlaw.com/pa/title-68-ps-real-and-personal-property/pa-st-sect-68-250-511a.html"
    - "https://www.phila.gov/media/20231204173843/Rental-License-Requirements_Nov-2023.pdf"

tax_rules:
  verified: true
  post_sale_treatment: "No sale-triggered reassessment and no assessment caps: Pennsylvania's Uniformity Clause bars reassessing a parcel on transfer, so the purchase price is not written in at closing. Instead the Office of Property Assessment runs periodic citywide mass revaluations (CAMA models driven by recent sales — TY2025 and TY2027 revalued, TY2026 skipped) and a recent arm's-length sale above the current assessment is exactly the market evidence that lifts the next value. TY2027: median residential bill change ~$97, but nearly 6,000 homes rose over 50% vs two years earlier (Inquirer). Appeals: First Level Review with OPA (TY2027 deadline 2026-09-01), formal BRT appeal (2026-10-05). Homestead Exemption ($100,000 off assessed value in TY2027) is owner-occupied only — covers an owner-occupied 2-4 unit's residence share; LOOP requires 10 years' ownership. Assume the seller's bill understates the buyer's within 1-2 revaluation cycles."
  risk: "MEDIUM"
  assessor_url: "https://www.phila.gov/departments/office-of-property-assessment/"
  treasurer_url: "https://www.phila.gov/services/payments-assistance-taxes/property-taxes/real-estate-tax/"
  source_url: "https://www.phila.gov/2026-06-30-city-of-philadelphia-to-mail-2027-property-assessments-and-launch-expanded-outreach-to-connect-homeowners-to-tax-relief/"

