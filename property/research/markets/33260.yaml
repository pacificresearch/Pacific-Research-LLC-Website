tax_rules:
  verified: true
  post_sale_treatment: "No reassessment-on-sale event, but Midland CAD must set fair market value for all property each year (Tax Code §23.01) and its board policy (2023-2024 Reappraisal Plan) is a general reappraisal of all property on a two-year cycle with field review of a portion of the county every year and sales data reviewed annually, so a recorded sale price feeds the next Jan 1 appraisal. The 10% homestead cap belongs to an owner-occupant seller and expires Jan 1 after a sale (Tax Code §23.23), so a 2-4 unit bought from a homesteaded owner can jump to market. Non-homestead real property <= ~$5M (CPI-adjusted) gets a 20% annual circuit-breaker cap (§23.231) but not in the first year of new ownership, and the statute expires 2026-12-31 unless extended."
  risk: "HIGH"
  assessor_url: "https://www.midcad.org/"
  treasurer_url: "https://midlandcad.propertytaxpayments.net/"    # Midland CAD collects property tax; county Tax Assessor-Collector (co.midland.tx.us/235/Tax-Office) handles motor vehicles only
  source_url: "https://iswdataclient.azurewebsites.net/pubs/MIDLANDCAD/Biennial%20Reappraisal/2023-2024_Reappraisal_Plan.pdf"

