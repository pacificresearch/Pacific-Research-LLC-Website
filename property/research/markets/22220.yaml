landlord_law:
  verified: false    # state statute texts read on FindLaw (current as of 2024-03-28), the AG page read directly, and Fayetteville Code §118.01 read in a 2021 council packet; Fayetteville Landlord's Representative Registry (ch. 120) details come from city reminders/third-party summaries, code text not read
  rent_control: "no — Ark. Code 14-16-601 and 14-54-1409: a local governmental unit (county, city, village, township) shall not enact, maintain, or enforce an ordinance or resolution that would have the effect of controlling the amount of rent charged for leasing private residential or commercial property; no local rent control exists (Fayetteville's 2024 $40 rental-application-fee cap, Ord. 6800, was repealed after the city attorney and AG said it likely violated state law)"
  just_cause_eviction: "no — civil unlawful detainer, Ark. Code 18-60-304: holdover after the term, holdover after written demand, or nonpayment plus three (3) days' notice to quit and written demand for possession; tenant has 5 days after summons to file a written objection or the sheriff may remove (Arkansas AG); separate criminal failure-to-vacate statute, Ark. Code 18-16-101: 10 days' written notice to vacate, willful refusal is a misdemeanor, $1-$25 per day, each day a separate offense"
  eviction_timeline_days: null
  rental_licensing: "no per-unit rental license or registration fee found in Fayetteville, Springdale or Rogers. Fayetteville: (1) Business Registry and License (Code ch. 118) required for landlords EXCEPT an individual (not an LLC/corporation) renting fewer than three (3) dwelling units — §118.01(D) — so an LLC-owned duplex or any triplex/fourplex needs a city business license; (2) Landlord's Representative Registry (Code ch. 120): owners of more than two residential rentals and all STRs must register a designated representative who lives/works in Washington, Benton, Crawford or Madison County, free, updates within 7 days (city reminder 2023; code text not read). Springdale and Rogers: no registration program located (third-party summary only)"
  rental_license_fee_annual: null
  inspection_frequency: "no systematic rental inspection program found in Fayetteville, Springdale or Rogers; enforcement is complaint-driven under adopted property-maintenance codes (not verified against city code); Fayetteville life-safety inspections apply to short-term rentals only"
  lead_rules: "federal only found: pre-1978 lead-based paint disclosure (42 U.S.C. 4852d; 24 CFR 35 / 40 CFR 745); no NWA city lead ordinance located"
  certificate_of_occupancy_rules: "no certificate-of-occupancy-on-sale or point-of-sale inspection requirement found for Fayetteville, Springdale or Rogers"
  security_deposit_limits: "Ark. Code 18-16-304: no more than two (2) months' periodic rent, however denominated; 18-16-305: return within 60 days of termination with itemized deductions (per Arkansas AG); 18-16-303: the subchapter does not apply to an individual owning five or fewer dwelling units unless a third party manages/collects rent for a fee — a self-managed 2-4 unit is outside the cap"
  local_landlord_taxes_fees: "none found beyond Fayetteville's business license for entity/3+ unit landlords (fee not located); no city rental-income or per-unit tax; real property assessed at 20% of market value statewide; Washington/Benton County millage applies (Fayetteville reported at up to 57.95 mills by local press, unverified)"
  utility_obligations: "Ark. Code 18-17-502 (Act 1052 of 2021; leases entered/renewed after 2021-11-01): landlord must supply hot and cold running water, electricity, potable water, sanitary sewer/plumbing to code, a functioning roof and building envelope, and functioning heating and A/C to the extent they served the premises at signing; tenant gives written notice (certified mail) and, if rent is current and the landlord does not remedy within 30 calendar days, the tenant's sole remedy is termination without penalty plus deposit refund — no rent withholding; stricter local housing codes still apply (18-17-502(h))"
