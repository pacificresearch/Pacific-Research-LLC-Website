tax_rules:
  verified: true
  post_sale_treatment: "Arkansas assesses real property at 20% of market value, reappraised county-wide every 4 years (Act 139 of 2023; Washington County's current cycle ends 2027 and Benton County's ends 2028 per the AACD 2025 Annual Report). Amendment 79 § 1(b) limits a NON-homestead parcel's taxable-value increase after reappraisal to 10%/yr, but the cap belongs to the seller: Ark. Code 26-26-1123(a)-(b) requires the assessor to assess a sold parcel at 20% of full appraised value at the next assessment date after transfer, and the new owner is not entitled to claim any limitation until the second assessment date after transfer (ACD Amendment 79 Assessor's Guide states the same rule). A 2-4 unit bought from a long-held owner therefore resets to full market value the following Jan 1, then faces the 2027 (Washington) / 2028 (Benton) reappraisal — the current owner's bill is never the post-purchase bill. Homestead credit ($500, $600 from 2026 bills) and 5% cap apply only to an owner-occupied unit. County assessor/collector pages returned HTTP 403 on 2026-11-23; URLs are the official washingtoncountyar.gov pages."
  risk: "HIGH"
  assessor_url: "https://washingtoncountyar.gov/government/elected-officials/assessor"
  treasurer_url: "https://washingtoncountyar.gov/government/departments-a-e/collector"
  source_url: "https://www.dfa.arkansas.gov/wp-content/uploads/AACD_AnnualReport_2025.pdf"

