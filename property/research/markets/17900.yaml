tax_rules:
  verified: true
  post_sale_treatment: "Arm's-length sale is an Assessable Transfer of Interest (SC Code 12-37-3140): Richland County reappraises the parcel at current fair market value for the next tax year, outside the 15% cap that otherwise limits increases in a five-year reassessment cycle (county-wide reassessment in years ending 4 and 9). Non-owner-occupied residential is assessed at 6% (legal residence 4%). A partial ATI exemption of up to 25% of ATI fair market value is available on application (12-37-3135); deadline per Assessor. Seller's bill (often 4%, pre-sale value) is never the buyer's bill."
  risk: "HIGH"
  assessor_url: "https://richlandcountysc.gov/government/departments/taxes/assessor"
  treasurer_url: "https://www.richlandcountysc.gov/Government/Departments/Taxes/Treasurer"
  source_url: "https://www.richlandcountysc.gov/Property-Business/Property-Valuation"

