incentives:                      # ONE-TIME money => YEAR-1 PERSONAL BENEFIT, never NOI
  - program: "Richland County Homeownership Assistance Program (RCHAP) — deferred forgivable second mortgage; NOTE: single-family detached only, so NOT applicable to a 2-4 unit purchase"
    dollar_value: 24500
    cash_or_noncash: cash
    eligibility: "SC resident; first-time buyer or no home ownership in last 3 years; HUD low/moderate income limits (2026 Columbia metro: $51,750 for 1 person to $97,550 for 8); must qualify for mortgage without co-signer; property in unincorporated Richland County or Town of Blythewood; single-family detached only (no townhomes/condos/mobile; no 2-4 unit)"
    minimum_income: "none stated; maximum gross household income per HUD limits applies"
    employment_requirement: "none"
    home_purchase_requirement: "single-family detached built after 1978; price cap $228,000 existing / $273,000 new; third-party, HVAC, CL-100 and county inspections; buyer contributes at least $500; contract cannot be ratified before application"
    residency_requirement: "must occupy as primary residence"
    minimum_stay: "5 years (assistance <= $14,999) or 10 years (>= $15,000); prorated recapture if sold earlier"
    application_deadline: "none listed; in-person application by appointment, $50 fee"
    funding_availability: "HUD-funded; open as of 2026-11 (workshops scheduled through 2027-10)"
    source_url: "https://www.richlandcountysc.gov/Property-Business/Homes-and-Communities/Grants/Homeownership-Assistance"
    verified: true

landlord_law:
  verified: true
  rent_control: "no — state preemption, SC Code 27-39-60 (no county or municipality may regulate the amount of rent on private residential or commercial rentals; 1985 Act 184)"
  just_cause_eviction: "no — SC Residential Landlord and Tenant Act (SC Code Title 27 Ch. 40) contains no just-cause requirement; only anti-retaliation limits (27-40-910)"
  eviction_timeline_days: 30
  rental_licensing: "yes — City of Columbia residential rental permit, $25/unit/yr, Ordinance 2015-099 (eff. 2016-07-01); owner or local agent within 45 miles must apply; permit non-transferable; business license required at 5+ units; fee waived for licensed professional management companies"
  rental_license_fee_annual: 25
  inspection_frequency: "no routine cycle — owner self-certifies minimum safety standards at permit; Code Enforcement inspects on request or complaint"
  lead_rules: "federal only (pre-1978 housing: EPA/HUD Section 1018 disclosure — pamphlet, known-hazard disclosure, Lead Warning Statement, records kept 3 years); no City of Columbia or Richland County lead ordinance found"
  certificate_of_occupancy_rules: "no point-of-sale CO or rental inspection found for City of Columbia; rental permits are non-transferable so a new owner must re-permit"
  security_deposit_limits: "no statutory cap; itemized return within 30 days of termination/possession/demand (27-40-410); treble damages plus attorney fees for wrongful withholding"
  local_landlord_taxes_fees: "City of Columbia business license for owners/managers of 5+ units; Richland County assesses non-owner-occupied residential at 6% vs 4% legal residence"
  utility_obligations: "landlord must supply running water, reasonable hot water and reasonable heat and maintain electrical, gas, plumbing and other facilities (27-40-440); essential services defined 27-40-210(17)"
  sources:
