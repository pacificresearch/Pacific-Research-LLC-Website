landlord_law:
  verified: false                 # every item below traces to a primary statute/agency page read this run EXCEPT the 10-day appeal period (UNC School of Government summaries, G.S. 7A-228 not opened) and the 'no local program found' negatives
  rent_control: "no — state preemption, G.S. 42-14.1(a): no county or city may enact, maintain, or enforce any ordinance regulating the amount of rent for privately owned residential or commercial rental property"
  just_cause_eviction: "no — no just-cause statute in NC Ch. 42 and no Hickory/Catawba ordinance found; landlord uses summary ejectment (G.S. 42-26 et seq.) for breach, holdover or lease expiry"
  eviction_timeline_days: 30      # statutory floor ≈ summons appearance ≤7 business days from issuance (G.S. 42-28) + 10-day appeal window (G.S. 7A-228, per UNC SOG) + sheriff executes writ ≤5 days of receipt (G.S. 42-36.2) + notice/filing time; uncontested cases typically ~3-5 weeks
  rental_licensing: "no — no City of Hickory rental registration/permit program found (city code search returned only the Land Development Code); G.S. 160D-1207(c) bars local permits-to-lease and general rental registration; registration + fee allowed ONLY for individual properties with >4 verified violations/12 mo, 2+ in 30 days, or top-10% crime/disorder"
  rental_license_fee_annual: null  # none; statutory cap $500/12-month period applies only to violation-flagged properties (G.S. 160D-1207)
  inspection_frequency: "none periodic — G.S. 160D-1207(a) limits inspections to reasonable cause (complaint, visible violation, >2 verified violations/12 mo) or designated blighted areas; Hickory minimum-housing enforcement is complaint-driven (city ordinance not read this run)"
  lead_rules: "federal only — pre-1978 units: EPA/HUD Lead Disclosure Rule (Title X §1018): EPA pamphlet, disclosure of known LBP/hazards and records, Lead Warning Statement in lease, keep 3 years; no Hickory/Catawba lead rental ordinance found"
  certificate_of_occupancy_rules: "none on sale or re-rent — no point-of-sale/rental CO inspection in Hickory found; G.S. 160D-1207(c) bars conditioning a CO on enrollment in any rental program or inspection before utility service"
  security_deposit_limits: "G.S. 42-51(b): max 1.5 months' rent for month-to-month tenancies, 2 months' rent for terms longer than month-to-month; must be held in NC trust account or bonded"
  local_landlord_taxes_fees: "none rental-specific — G.S. 160D-1207(c) bars fees/taxes levied only on rental property; ordinary Catawba County + City of Hickory ad valorem property tax applies (2026 rates on county Tax Office page, not pulled)"
  utility_obligations: "G.S. 42-42: landlord must maintain electrical, plumbing, sanitary, heating, ventilating and A/C systems; heat capable of 65°F Nov 1-Mar 31; smoke alarms (10-yr lithium on replacement) and CO alarm per level where fossil-fuel appliance or attached garage; landlord may bill tenants for water/sewer under G.S. 42-42.1; City of Hickory is the water provider — no master-metering rule found"
