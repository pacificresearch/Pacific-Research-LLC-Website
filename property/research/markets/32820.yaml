landlord_law:
  verified: false                # statute text read from a code-publisher compilation (CAATN URLTA 2025 PDF; FindLaw for 66-35-102), not capitol.tn.gov; Memphis items from memphistn.gov code-enforcement pages; Environmental Court rules PDF not readable; Memphis City Code not searched.
  rent_control: "no — state preemption, Tenn. Code Ann. 66-35-102(a): a local governmental unit shall not enact, maintain or enforce an ordinance or resolution controlling the amount of rent for private residential or commercial property; subsection (b) (added 2024, Pub. Ch. 1051, eff. 2024-07-01) also bars mandatory below-market / inclusionary requirements; voluntary incentive programs allowed"
  just_cause_eviction: "no — Tennessee URLTA (66-28, applies in Shelby County: counties >75,000 pop. per 2010 census, 66-28-102) has no just-cause requirement. Month-to-month terminable by either party on 30 days' written notice (66-28-512(b)); week-to-week 10 days. Nonpayment/curable breach: 14-day notice to cure or terminate (66-28-505(a)(2)), 7 days on repeat within 6 months; non-curable breach 14 days (505(a)(3)); 3-day termination for violence, drug activity or hazardous conditions (66-28-517). 2024 Pub. Ch. 1009 (eff. 2024-07-01) added a sheriff removal remedy for unauthorized occupants/squatters (new 29-18-135; not for current/former tenants) — enrolled text not read. 2025 bills HB1345/SB1088 to cut 14 days to 7 FAILED. Court (detainer warrant, Shelby County General Sessions) timeline after notice: UNKNOWN"
  eviction_timeline_days: null
  rental_licensing: "no — Memphis has NO long-term rental registry: state 66-28-107 (landlord registration, $10/yr fee, $50/week fine) applies ONLY to metropolitan governments >500,000 (66-28-107(c)), i.e. Nashville; Memphis/Shelby bills to authorize a registry failed in the General Assembly (2022, 2024 per local press). Short-term rentals have a separate City registry (transitioning to Planning & Development, 2026). Code Enforcement (Division of Community Enhancement) enforces Ordinance 5708 / IPMC on complaint"
  rental_license_fee_annual: null
  inspection_frequency: "no routine rental inspection cycle; complaint-driven (311 / 901-636-7464). Violation orders with follow-up inspection (14 days for vehicles); dangerous structures referred to Special Operations (title search, certified 'First Notice', condemnation); uncorrected cases prosecuted in Shelby County Environmental Court (General Sessions Division 14, created 1991)"
  lead_rules: "federal only confirmed (pre-1978 housing: EPA/HUD Section 1018 — EPA pamphlet, disclosure of known lead-based paint/hazards and records, Lead Warning Statement in lease, records kept 3 years); Shelby County Health Department lead program / any local lead-safe rental rule NOT researched this run — UNKNOWN"
  certificate_of_occupancy_rules: "no point-of-sale certificate of occupancy or rental inspection on sale found for Memphis (code enforcement pages silent; City Code not opened) — UNKNOWN"
  security_deposit_limits: "no statutory cap. Deposits must be held in a dedicated account at a TN/federally regulated institution and the tenant told the account location at signing (66-28-301(a),(h)); tenant has right to a move-out inspection and itemized damage list; landlord forfeits right to retain any deposit if not held in the required account or no damage list (301(c)); refund notice to last known address, unclaimed after 60 days reverts to landlord (301(f)); later-discovered damage recoverable only if found within 30 days of vacancy or 7 days after a new tenant (301(g))"
  local_landlord_taxes_fees: "no Memphis landlord license/fee found. Double property tax inside city limits (City of Memphis + Shelby County; 2026 rates not read — UNKNOWN; county rate cut ~20% at the 2025 reappraisal per press). Statewide: 66-28-302 (as amended by the 2024 'Landlord Transparency Act', SB1694/HB1814, eff. 2025-01-01 — chaptered text not read) requires written disclosure of managing agent, owner/agent for service of process, and a maintenance phone/email or online portal; binds successor owners"
  utility_obligations: "URLTA 66-28-304(a): landlord must comply with building/housing codes affecting health and safety, keep premises fit and habitable, keep common areas clean and safe, and in complexes of 4+ units provide waste receptacles; no statutory requirement that landlord pay utilities — allocation is by lease. MLGW (municipal) supplies electric, gas and water (tariffs/landlord agreements not read)"
  sources:
    - "https://codes.findlaw.com/tn/title-66-property/tn-code-sect-66-35-102/"
    - "https://assets-002.noviams.com/novi-file-uploads/caatn/URLTA_2025.pdf"
    - "https://wapp.capitol.tn.gov/apps/BillInfo/Default.aspx?BillNumber=SB1088&GA=114"
    - "https://memphistn.gov/code-enforcement/"
    - "https://memphistn.gov/neighborhood-improvement"
    - "https://www.tncourts.gov/sites/default/files/docs/enviromental_court_rules.pdf"
    - "https://www.epa.gov/lead/real-estate-disclosures-about-potential-lead-hazards"

