  post_sale_treatment: "No sale-triggered reassessment in Tennessee. Shelby County reappraises real property every four years: last reappraisal 2025, next 2029 (Comptroller Division of Property Assessments schedule: LAST 2025 / NEXT 2029 / cycle 4; Assessor's site states the same per search — site returned HTTP 403, not read). Between reappraisals value changes only for physical changes. Residential/rental real property assessed at 25% of appraised value. 2026 appraisal ratio 1.0000 (values at market), so a 2026-27 buyer's bill should track the seller's post-2025 bill until the 2029 reset, when City and County rates are recertified revenue-neutral (67-5-1701). The 2025 reappraisal raised values ~27% county-wide (Assessor, via press) — confirm the seller's bill is the POST-2025 bill, not 2024's. Appeals to the County Board of Equalization due June 30 (July 31 in reappraisal years) per Trustee FAQ"
