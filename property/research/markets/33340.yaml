landlord_law:
  verified: false                # 66.1015 read via FindLaw reproduction (docs.legis blocked); ATCP 134 / 704.17 read from the DATCP Landlord Tenant Guide (03/2026, a state-agency primary); Act 176 / 66.0104 text from docs.legis search excerpts; Milwaukee ordinance items from local press and council releases
  rent_control: "no — state preemption, Wis. Stat. 66.1015(1): no city, village, town or county may regulate the amount of rent or fees charged for the use of a residential rental dwelling unit (exceptions only for units the government/housing authority owns or agreements with private persons); (3)(b) also bars inclusionary zoning"
  just_cause_eviction: "no — Wis. Stat. ch. 704 has no just-cause requirement. Month-to-month ends on 28 days' written notice (704.19). Default notices under 704.17: month-to-month — 14-day no-cure notice for nonpayment or breach (or 5-day cure); lease of one year or less — 5-day cure notice for nonpayment/breach, then 14-day no-cure if a second default occurs within 12 months; lease over one year — 30 days to cure; 5-day no-cure notice for criminal/drug activity (704.17(3m)); holdover tenants owe double rent (704.27)"
  eviction_timeline_days: null   # notice 5-14 days (704.17) then small-claims eviction under Wis. Stat. ch. 799 (writ of restitution 799.44; writ void if sheriff receives it >30 days after issuance; 15-day appeal window); Milwaukee County filing-to-lockout days not published in a primary source read — UNKNOWN
  rental_licensing: "no — Milwaukee has no rental license or landlord registration. State preemption: Wis. Stat. 66.0104(2)(e) (2015 Act 176, amended 2017 Act 317) bars local certification/registration/licensing of rental units except a registry limited to owner name, contact person, address and phone (one-time fee <= $10 outside first-class cities; Milwaukee is WI's only first-class city). 2024-25 'landlord registration ordinance' proposal: no adopted ordinance found this run — UNKNOWN. Tenant Life Safety Disclosure ordinance (File 250302, adopted 2025-11-25) requires owners of 3+ unit buildings to give tenants standardized fire alarm/sprinkler compliance disclosures"
  rental_license_fee_annual: null
  inspection_frequency: "complaint-based (Dept. of Neighborhood Services) citywide. Rental Property Inspection District #1 — Uptown (roughly W. Center St / N. Sherman Blvd / W. North Ave / N. 50th St; ~200 rental properties, 399 units) adopted 2026-09-22 (Files 260362/260363) as a 5-year pilot: ~20 initial inspections/month, pass = removed from cycle for 5 years, uncorrected violations = annual reinspection; fees $90 (initial inspection finding a violation) / $150 (subsequent), none when no habitability violation; owner-occupied single-family excluded; no additional districts may be added during the pilot. The earlier Residential Rental Inspection (Residential Rental Certificate, 2009) program was curtailed by 2015 Act 176; 66.0104(2)(d) now limits districts to areas with documented blight/complaints/code violations and caps fees ($75/$150)"
  lead_rules: "federal pre-1978 EPA/HUD disclosure (most Milwaukee duplexes are pre-1950). Milwaukee: 1999/2000 Community Lead Safe Zones pilot ordinance (pre-1950 rentals in two target areas; lead hazard control certificate; window abatement) — current enforcement status UNKNOWN; 2022 Lead Enforcement Ordinance added penalties for landlords who fail to correct Health Dept. lead hazard orders and anti-retaliation protections (council releases); a mandatory citywide lead-safe rental certification was proposed but no adopted ordinance found; Milwaukee Health Dept. Lead-Safe Registry is voluntary; WI DHS Lead-Safe Homes Program funds abatement"
  certificate_of_occupancy_rules: "no point-of-sale inspection, transfer CO, or rental-occupancy permit found for Milwaukee; Wis. Stat. 66.0104(2)(f) bars local occupancy or transfer-of-tenancy fees. Verify legal unit count against the City Assessor record (assessments.milwaukee.gov) and DNS permit history — a 'triplex' assessed as a duplex is a conversion risk"
  security_deposit_limits: "no cap in Wis. Stat. ch. 704 or ATCP 134 (DATCP guide sets procedures only). ATCP 134.06: before accepting a deposit landlord must give the tenant at least 7 days to document pre-existing damage and offer the prior tenant's damage list; deposit (less lawful withholdings — unpaid rent, tenant damage beyond normal wear, utilities owed) returned with itemized statement within 21 days after the tenancy ends (or after re-rental if earlier) (134.06(2),(4)); earnest money returned next business day if not approved (134.05)"
  local_landlord_taxes_fees: "none — no rental license, registration fee, landlord tax, or local income tax; inspection fees apply only inside the Uptown pilot district when violations are found; Milwaukee County Sheriff eviction execution $60/hr per deputy (max 2) per Sheriff Civil Process fee page"
  utility_obligations: "ATCP 134.04(3): before renting, landlord must disclose whether utilities are included and, where units/common areas are not separately metered, how costs are allocated among units; 134.04(2) requires disclosure of uncorrected code violations, heating not capable of 67 F, lack of hot/cold water, unsafe electrical/plumbing/sewage. Milwaukee Water Works charges attach to the property (lien) — not read this run"
  sources:
    - "https://codes.findlaw.com/wi/municipalities-ch-59-to-68/wi-st-66-1015/"
    - "https://datcp.wi.gov/Documents/LT-LandlordTenantGuide497.pdf"
    - "https://docs.legis.wisconsin.gov/2015/related/acts/176"
    - "https://docs.legis.wisconsin.gov/document/statutes/66.0104"
    - "https://docs.legis.wisconsin.gov/document/statutes/704.17"
    - "https://urbanmilwaukee.com/2026/09/18/proactive-rental-inspections-poised-to-return-to-milwaukee/"
    - "https://urbanmilwaukee.com/pressrelease/council-adopts-files-creating-a-rental-property-inspection-program/"
    - "https://city.milwaukee.gov/ImageLibrary/Groups/ccCouncil/News/2025/District-11/11---Fire-Safety-Ordinance-Adopted-Release.pdf"
    - "https://nchh.org/policy/state-and-local-lead-laws/milwaukee-lead-law/"
    - "https://county.milwaukee.gov/EN/Sheriff/Divisions/Civil-Process"

tax_rules:
  verified: true
  post_sale_treatment: "Wisconsin assesses at full market value (Wis. Stat. 70.32) and the City of Milwaukee revalues every parcel every year using prior-year arm's-length sales. There is no mechanical sale reset and no cap, but the DOR Guide for Property Owners (2026) states a recent arm's-length sale of the property is 'the best indicator of market value', the assessor 'must review the sale' (may request interior inspection) and uses sales in the next revaluation — the assessor may not change one parcel solely on its own sale without adjusting comparables, so a purchase well above assessment is typically absorbed over the next one or two annual revaluations rather than at closing. Citywide values +15.4% (2025) and median residential +7.6% (2026) per press. Appeal: Milwaukee Board of Assessors then Board of Review; objection deadline in May each year (verify current date on assessor site). No owner-occupant exemption beyond the state Lottery & Gaming Credit and School Levy Credit."
  risk: "MEDIUM"
  assessor_url: "https://city.milwaukee.gov/assessor"
  treasurer_url: "https://city.milwaukee.gov/treasurer"
  source_url: "https://www.revenue.wi.gov/DOR%20Publications/pb060.pdf"

