landlord_law:
  verified: false
  rent_control: "no — state preemption: Iowa Code §364.3(9) (2026 Code numbering; often cited as 364.3(12) in secondary sources — the 2026 text places the rent limitation at subsection 9) bars any city ordinance limiting the rent charged for private residential or commercial property; §364.3(11) also bars city ordinances conflicting with §562A.27B/562B.25B (source-of-income/voucher refusals); §364.3(3)(d) bars point-of-sale compliance/fee requirements"
  just_cause_eviction: "no — Iowa Code §562A.34: month-to-month tenancy terminable by either party on 30 days' written notice without cause (10 days week-to-week); §562A.27: 3-day notice to pay or quit for nonpayment, 7-day notice with right to cure for other material noncompliance (7-day no-cure if repeated within 6 months); §562A.27A clear-and-present-danger 3-day"
  eviction_timeline_days: 21   # 3-day notice + FED hearing set no later than 8 days from filing (15 with plaintiff consent), Iowa Code §648.5; writ/removal after judgment adds days — a 3-4 week uncontested path is the statutory shape, not a measured median
  rental_licensing: "yes — City of Iowa City rental permit required for every rental dwelling (Housing Inspection Services, Iowa City Code Title 17 Ch. 5 Housing Code; fees set by council resolution); fee components reported as $9 per bedroom + $40 first-time Certificate of Structural Compliance (city page snippet, undated); Gazette example $218 for a 4-bedroom house — city page and amlegal code returned 403, so the current schedule is UNKNOWN"
  rental_license_fee_annual: null
  inspection_frequency: "periodic Housing Inspection Services inspection tied to permit renewal; Gazette reported the council voted to move from every 2 years to annual (article not readable; date unknown); the 2018 rental code update 'increased the frequency' per the city page snippet — current cycle UNKNOWN"
  lead_rules: "federal only found: pre-1978 lead-based paint disclosure (42 U.S.C. 4852d; 24 CFR 35 / 40 CFR 745); no Iowa City lead ordinance located; Iowa Code ch. 135 lead program not reviewed"
  certificate_of_occupancy_rules: "no point-of-sale inspection — Iowa Code §364.3(3)(d) prohibits cities from conditioning sale/refinance/transfer on compliance actions or fees; Iowa City requires a one-time Certificate of Structural Compliance when a dwelling first becomes a rental ($40 per city page snippet)"
  security_deposit_limits: "max 2 months' rent (Iowa Code §562A.12(1)); held in a federally insured account, not commingled; return or itemized statement within 30 days of termination and receipt of tenant's forwarding address (§562A.12(3)); failure to furnish the statement forfeits all right to withhold; bad-faith retention = punitive damages up to 2x monthly rent + actual damages (§562A.12(7))"
  local_landlord_taxes_fees: "rental permit fees (above; schedule UNKNOWN); no city rental tax; property tax: residential class incl. 2-4 units taxed on rollback value (44.5345% of assessed for AY2025 / FY26-27) x local levy; no state income-tax surcharge on rental income (flat 3.8%)"
  utility_obligations: "Iowa Code §476.20: regulated gas/electric utilities may not disconnect Nov 1 - Apr 1 a residence with a resident certified LIHEAP/weatherization-eligible head of household (not a blanket moratorium), and disconnection notices must carry LIHEAP information; landlord duties to maintain and supply running water, hot water and heat where landlord-furnished under §562A.15 (not read); §562A.27(4) lets a tenant repair-and-deduct up to one month's rent as a nonpayment defense after 7 days' notice"
