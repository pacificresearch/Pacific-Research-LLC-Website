tax_rules:
  verified: true
  post_sale_treatment: "No reassessment-on-sale and no transfer-triggered cap reset. Iowa law reassesses all real property in ODD-numbered years (2023, 2025, 2027): the assessor reviews recent sales and re-estimates market value for all parcels in an area, so a buyer's purchase price enters the comparable-sales pool for the next odd-year revaluation rather than resetting that parcel alone. Iowa City has its OWN City Assessor (iowacity.iowaassessors.com — site returned 403); the Johnson County Assessor covers the rest of the county and runs a revolving 8-10 year physical reappraisal (2023-2030 schedule). Assessed value is then multiplied by the statewide residential ROLLBACK set by the Iowa Dept. of Revenue (AY2025: 44.5345% for FY26-27; AY2024: 47.4316%; AY2023: 46.3428%), which limits statewide aggregate residential taxable-value growth, not any individual parcel; 2-4 unit dwellings are in the residential class. Timing lag: 1/1/2025 assessments appear on bills due Sept 2026 and Mar 2027; Johnson County Treasurer collects in halves due Sept 1 and Mar 1 (penalty-free through Sept 30 / Mar 31; 1.5%/month late). Protest window to the Board of Review in spring of the assessment year."
  risk: "MEDIUM"
  assessor_url: "https://iowacity.iowaassessors.com/"
  treasurer_url: "https://johnsoncountyiowa.gov/treasurer"
  source_url: "https://johnsoncountyiowa.gov/county-reappraisal"

