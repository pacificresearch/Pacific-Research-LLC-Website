landlord_law:
  verified: false
  rent_control: "no — state preemption, ORC 5321.19(A) as amended by HB 430 (134th GA, eff. 2022-09-23): political subdivisions may not regulate rental terms 'including, without limitation, by any way imposing or requiring rent control or rent stabilization'; ORC 5321.20 declares it a matter of statewide concern"
  just_cause_eviction: "no — Ohio has no just-cause requirement; forcible entry and detainer (ORC Ch. 1923) requires a 3-day notice to leave with statutory language (ORC 1923.04(A)); hearing on possession set per local court rules but not sooner than 7 days after service is complete (ORC 1923.06(H)(1))"
  eviction_timeline_days: 21   # statutory shape: 3-day notice (1923.04) + service + hearing ≥7 days after service (1923.06) + writ/set-out — a ~3-week uncontested path is the statutory floor, not a measured median
  rental_licensing: "yes — registration of every Toledo residential rental on the Lucas County Auditor's rental registry (city ordinances of 2020-10; enforcement by Toledo Code Enforcement under TMC Ch. 1767); registration itself carries NO fee per the code chapter as surfaced in search (code library page not directly retrievable — UNVERIFIED); the substantive cost is the Lead-Safe Certificate on pre-1978 1-4 unit rentals ($25 city fee per unit, 2024 city release) plus the private clearance exam"
  rental_license_fee_annual: 0
  inspection_frequency: "no periodic city rental inspection cycle found; complaint-based code enforcement; lead clearance examination required before each new tenancy on uncertified pre-1978 1-4 unit rentals (certificate validity period not stated on city pages — UNKNOWN)"
  lead_rules: "federal pre-1978 disclosure (EPA/HUD) PLUS Lead Safe Toledo ordinance: residential rentals of 1-4 units built before 1978 (and family child-care homes) must obtain and maintain a valid Lead-Safe Certificate before being rented or re-rented — register on the Auditor's registry, hire a State-licensed and city-registered lead inspector/risk assessor/clearance technician (~$400 in Toledo), correct hazards, pass a clearance exam with dust-wipe sampling, apply via the city permit portal ($25 non-refundable certificate fee, 2024 release); landlord must give tenant the certificate copy with the EPA pamphlet; phase-in began 2022-06-30 with all covered properties due by 2026-12-31; non-compliance referred to Housing Court; land-contract sales generally exempt, lease-purchase covered"
  certificate_of_occupancy_rules: "no point-of-sale or certificate-of-occupancy inspection requirement for residential sales found on City of Toledo pages (not exhaustively confirmed — UNKNOWN)"
  security_deposit_limits: "no statutory cap (ORC 5321.16); 5% annual interest owed on any portion exceeding the greater of $50 or one month's rent if tenancy lasts 6+ months; itemized deductions and balance returned within 30 days of termination + delivery of possession; wrongful withholding = amount withheld as damages plus attorney fees (tenant must give forwarding address)"
  local_landlord_taxes_fees: "no landlord-specific tax found; $25 Lead-Safe Certificate fee per covered unit; non-owner-occupied units are not eligible for Ohio's owner-occupancy credit (2.5% rollback)"
  utility_obligations: "landlord must supply running water, reasonable amounts of hot water and reasonable heat at all times, except where the tenant controls the heat/hot-water installation supplied by a direct public utility connection, and must keep all electrical, plumbing, sanitary, heating, ventilating and A/C fixtures the landlord supplies in good and safe working order (ORC 5321.04(A)(4),(6))"
