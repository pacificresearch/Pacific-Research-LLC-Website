tax_rules:
  verified: true
  post_sale_treatment: "No sale-triggered reassessment in Ohio. Lucas County values twice in a six-year cycle — a full revaluation then a triennial update three years later (Auditor: 'The last Lucas County Revaluation was 2024, and 2021 was the last Triennial'); the Ohio Department of Taxation's 2026-01-15 bulletin moved Lucas's next reappraisal to 2028, so the cadence is disrupted and the next update year is not published. Valid arm's-length sales feed neighborhood-scale mass appraisal (sales-ratio studies to the 90-110% IAAO band) at those updates, not a per-parcel reset at closing. A buyer's own price can be used against them only through a Board of Revision complaint (filing window Jan 1-Mar 31; one challenge per 3-year cycle): HB 126 (134th GA, 2022) bars school boards from original complaints unless the sale was in the prior year AND exceeded the auditor's value by both >10% and >$500,000 (indexed), so a sub-$400K 2-4 unit purchase is effectively shielded. Immediate bill movers: loss of the 2.5% owner-occupancy credit if the seller was owner-occupied, and any homestead exemption the seller held. Taxes paid in arrears, semi-annual."
  risk: "LOW"
  assessor_url: "https://www.lucascountyohioauditor.gov/"
  treasurer_url: "https://www.lucascountytreasurer.org/"
  source_url: "https://content.govdelivery.com/accounts/OHTAX/bulletins/4048d9f"

