landlord_law:
  verified: false                # statute text read from a code-publisher compilation (CAATN URLTA 2025 PDF; FindLaw for 66-35-102), not capitol.tn.gov; local items from city pages. Jackson code (Municode) could not be opened.
  rent_control: "no — state preemption, Tenn. Code Ann. 66-35-102(a): a local governmental unit shall not enact, maintain or enforce an ordinance or resolution controlling the amount of rent for private residential or commercial property; subsection (b) (added 2024, Pub. Ch. 1051, eff. 2024-07-01) also bars mandatory below-market / inclusionary requirements; voluntary incentive programs allowed"
  just_cause_eviction: "no — Tennessee URLTA (66-28, applies in Madison County: counties >75,000 pop. per 2010 census, 66-28-102) has no just-cause requirement. Month-to-month terminable by either party on 30 days' written notice (66-28-512(b)); week-to-week 10 days. Nonpayment/curable breach: 14-day notice to cure or terminate (66-28-505(a)(2)), 7 days on repeat within 6 months; non-curable breach 14 days (505(a)(3)); 3-day termination for violence, drug activity or hazardous conditions (66-28-517). 2025 bills HB1345/SB1088 to cut 14 days to 7 FAILED (HB1345 failed in subcommittee 2025-03-12; SB1088 sent to general subcommittee 2025-03-18). Court (detainer warrant, General Sessions) timeline after notice: UNKNOWN"
  eviction_timeline_days: null
  rental_licensing: "no — no City of Jackson rental registration, license or rental-inspection program found (city codes page lists 2018 IPMC enforcement from 2022-01-01 by Building & Codes; no rental program). State landlord-registration statute 66-28-107 ($10/yr fee, $50/week fine) applies ONLY to metropolitan governments >500,000 (66-28-107(c)) — i.e. Nashville, not Jackson. Jackson Code of Ordinances (Municode) could not be opened to confirm — treat as UNKNOWN pending a code check"
  rental_license_fee_annual: null
  inspection_frequency: "no routine rental inspection cycle found; City of Jackson Building & Codes enforces the 2018 International Property Maintenance Code (adopted, enforced since 2022-01-01) on complaint/nuisance basis"
  lead_rules: "federal only (pre-1978 housing: EPA/HUD Section 1018 — EPA pamphlet, disclosure of known lead-based paint/hazards and records, Lead Warning Statement in lease, records kept 3 years); no City of Jackson or Madison County lead ordinance found"
  certificate_of_occupancy_rules: "no point-of-sale certificate of occupancy or rental inspection on sale found for Jackson, TN (city codes page silent; municipal code not opened) — UNKNOWN"
  security_deposit_limits: "no statutory cap. Deposits must be held in a dedicated account at a TN/federally regulated institution and the tenant told the account location at signing (66-28-301(a),(h)); tenant has right to a move-out inspection and itemized damage list; landlord forfeits right to retain any deposit if not held in the required account or no damage list (301(c)); refund notice to last known address, unclaimed after 60 days reverts to landlord (301(f)); later-discovered damage recoverable only if found within 30 days of vacancy or 7 days after a new tenant (301(g))"
  local_landlord_taxes_fees: "none Jackson-specific found. Statewide: 66-28-302 (as amended by the 2024 'Landlord Transparency Act', SB1694/HB1814, eff. 2025-01-01 — chaptered text not read, legiscan blocked) requires written disclosure at/before tenancy of the managing agent, an owner/agent for service of process, and a maintenance phone/email or online portal; binds successor owners. Property tax: Madison County + City of Jackson rates not read (UNKNOWN)"
  utility_obligations: "URLTA 66-28-304(a): landlord must comply with building/housing codes affecting health and safety, keep premises fit and habitable, keep common areas clean and safe, and in complexes of 4+ units provide waste receptacles; no statutory requirement that landlord pay utilities — allocation is by lease. Jackson Energy Authority (JEA) is the municipal electric/gas/water/wastewater provider (tariffs not read)"
  sources:
    - "https://codes.findlaw.com/tn/title-66-property/tn-code-sect-66-35-102/"
    - "https://assets-002.noviams.com/novi-file-uploads/caatn/URLTA_2025.pdf"
    - "https://wapp.capitol.tn.gov/apps/BillInfo/Default.aspx?BillNumber=SB1088&GA=114"
    - "https://cityofjacksontn.hosted.civiclive.com/government/codes_ordinances"
    - "https://www.epa.gov/lead/real-estate-disclosures-about-potential-lead-hazards"
    - "https://library.municode.com/tn/jackson/codes/code_of_ordinances"

tax_rules:
  verified: true
  post_sale_treatment: "No sale-triggered reassessment in Tennessee. Madison County appraises on a 5-year reappraisal cycle: last reappraisal 2022, next 2027 (Comptroller Division of Property Assessments schedule; Assessor's page: 'Madison County's next Reappraisal is scheduled for 2027'). Between reappraisals ~1/3 of parcels are field-inspected each year and value changes only for physical changes (Value Change Notice). Residential/rental real property is assessed at 25% of appraised value (TN constitution/67-5-801). 2026 county appraisal ratio is 0.7574 (values ~24% below market; Assessor cites median sale $251,450 Jan 2026 vs $212,500 at the 2022 reappraisal, +18.3%), so a buyer's 2027 bill will be set on a fresh market value while the county-wide rate is recertified to be revenue-neutral (67-5-1701). Seller's current bill is NOT a reliable proxy for the 2027+ bill"
  risk: "MEDIUM"
  assessor_url: "https://www.madisoncountytn.gov/90/Assessor-of-Property"
  treasurer_url: "https://www.madisoncountytn.gov/120/Trustee"
  source_url: "https://comptroller.tn.gov/office-functions/pa/tax-resources/assessment-information-for-each-county/reappraisal-schedule.html"

