# Search vocabulary. Regexes are matched against the lowercased job title.
# Discovery keeps a posting only if an include pattern matches and no exclude does.

include_title_patterns:
  # Category A — clinical research (beyond entry level)
  - 'clinical (research|trial|study|project|program|operations?|ops)'
  - '\bclinical research associate\b|\bcra\b|\bsr\.? cra\b|clinical monitor'
  - 'clinical (trial|study|project) (manager|lead|leader|director)'
  - 'research (operations|program|project) (manager|director|lead|administrator)'
  - 'research (manager|administrator)'
  - '(senior|sr\.?|lead|supervis\w*) clinical research coordinator'
  - 'clinical research (supervisor|manager|program|quality|compliance|director)'
  - 'study start.?up|site (activation|start.?up|management|relationship)'
  - 'ecoa|ecoa|eclinical|clinical (systems|data) (manager|lead)'
  - 'decentralized|patient recruitment (manager|lead)'
  # Category B — best overall fit
  - '(global|public|population) health'
  - 'health security|biosecurity|biodefense|pandemic|preparedness|emergency (management|response|preparedness)'
  - '(healthcare|health|biomedical|medical technology|medical device|life sciences?|clinical) program'
  - '(healthcare|health|biomedical|clinical|research|scientific|medical) operations'
  - 'program manager|program management|programme manager|programme officer|program officer|program director'
  - 'project manager|project management'
  - 'technical program manager'
  - 'partnership|alliance manager|strategic (partnerships|initiatives)'
  - 'business development.*(health|clinical|life|federal|government)|capture manager'
  - 'humanitarian|relief|refugee|migration health|resettlement'
  - 'operations manager|operations director|director of operations'
  - 'healthcare technology|htm\b|biomedical (equipment|engineering) manager|clinical engineering manager'
  - 'health policy|policy analyst'
  - 'federal|government (program|project)'
  - 'implementation (manager|lead)|deployment (manager|lead)'
  # Broadened 11/11 (Andrew: more solid applications) — PM/ops roles across healthcare, gov services, consulting
  - 'project (coordinator|lead|director|specialist)|program (coordinator|lead|specialist|analyst)'
  - '(portfolio|pmo) (manager|lead|analyst)|\\bpmo\\b'
  - 'operations (lead|specialist|analyst|program)|business operations|strategy (and|&) operations'
  - '(quality|compliance) (manager|lead|program)|quality assurance manager|gcp|audit (manager|lead)'
  - 'regulatory (affairs )?(project|program|operations) (manager|lead)'
  - 'vendor (manager|management)|contract(s)? manager|procurement (manager|lead)'
  - 'grants? (manager|management|administrator)|sponsored (programs|research)'
  - 'medical (affairs|operations) (manager|lead)|medical science liaison'
  - 'healthcare (consultant|consulting|operations)|management consultant.*(health|life sciences)'
  - 'readiness|continuity of operations|\\bcoop\\b|logistics (manager|lead|program)'
  - 'training (manager|program manager|lead)|learning (and|&) development manager'
  # Added 11/11 (Andrew: equity upside + top-paying medtech sales ladders)
  - 'clinical (specialist|consultant|educator|education|applications?|support specialist|field)'
  - 'field clinical (engineer|specialist|representative)|clinical field engineer|field service engineer'
  - 'clinical territory associate|associate (sales|territory|clinical) (representative|rep|manager|specialist)|sales associate.*(medical|surgical|clinical)'
  - '(ep|electrophysiology|mapping|cardiac|neuro|robotic|surgical|procedure|case) (mapping )?specialist'
  - '(clinical|surgical|medical device|capital).*account manager|account manager.*(clinical|surgical|medical)'
  - 'chief of staff|business operations (manager|lead|director)|strategy (manager|associate)'
  # Category C — international (most international titles also hit the above)
  - 'country (director|manager|representative)|deputy chief of party|chief of party'
  - 'health (officer|specialist|coordinator|adviser|advisor)'
  - 'medical (coordinator|logistics|logistician)|health logistics|supply chain.*health'
  - 'monitoring.*evaluation|\bmeal\b|m&e'

exclude_title_patterns:
  - '\bintern(ship)?\b|\bstudent\b|\bfellowship\b|\bpostdoc'
  - 'software engineer|\bdeveloper\b|\bsre\b|machine learning engineer|data engineer|devops'
  - '^(?!.*(clinical|surgical|medical|device|associate|mapping|robotic)).*(sales (representative|rep|executive)|account (executive|manager)|territory|key account)'
  - '\brn\b|\bnurse\b|nursing|physician|\bmd\b|pharmacist|surgeon|therapist|dentist|veterinar|psychiatrist|nephrologist|\w+ologist\b|phlebotom'
  - 'scientist(?!.*program)|chemist|biologist|lab(oratory)? technician'
  - 'vice president|\bvp\b|chief (?!of (party|staff))|\bsvp\b|\bevp\b|head of'
  - 'mechanic|driver|warehouse|janitor|custodian|cook|cashier'
  - 'accountant|payroll|tax |auditor(?!.*clinical)'
  - 'medical writer|regulatory writer|biostatistician|statistical programmer'

