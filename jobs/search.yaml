# Family/category lexicons used for scoring (lowercase substrings)
category_keywords:
  A: [clinical research, clinical trial, clinical study, clinical operations, cra, monitoring visit, site management,
      protocol, gcp, ich, irb, edc, ctms, enrollment, recruitment, sponsor, cro, investigator, study start, tmf,
      decentralized, dct, ecoa, epro, econsent, redcap, oncore, medidata, rave, infectious disease, nih]
  B: [program management, project management, stakeholder, cross-functional, budget, federal, government,
      partnership, strategy, operations, medical device, biomedical, healthcare technology, health security,
      biosecurity, preparedness, vendor, contract, procurement, risk, milestones, kpi, implementation,
      business development, capture, dod, va, hhs, darpa, barda, cdc]
  C: [global health, international, humanitarian, country office, field, low- and middle-income, lmic, usaid,
      un agency, unicef, who, refugee, migration, emergency response, capacity building, ngo, donor,
      multilateral, cross-cultural, travel, overseas, latin america, brazil, africa, asia]

